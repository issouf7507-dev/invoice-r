# /etc/nginx/sites-available/facture.royalcargo225.com
#
# Reverse proxy for the Next.js app (PM2, listening on 127.0.0.1:3999).
# Install with:
#   sudo ln -s /etc/nginx/sites-available/facture.royalcargo225.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see deploy/SETUP.md) — it will rewrite this file to add
# the SSL server block and the HTTP -> HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name facture.royalcargo225.com;

    # Used by certbot for the ACME HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://localhost:3999;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR support (harmless in production, needed for Next.js dev tooling).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 10m;
}
