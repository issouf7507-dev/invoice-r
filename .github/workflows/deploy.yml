name: Deploy to VPS

on:
  push:
    branches: [dev-issouf-f]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/dev-issouf/apps/facturer
  # Placeholder URL used only so `prisma generate` / `next build` can resolve
  # the DATABASE_URL env var — no real DB connection is made at build time.
  DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          cp ecosystem.config.js deploy/

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create release directory on VPS
        id: release
        run: |
          RELEASE="release-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          echo "name=$RELEASE" >> "$GITHUB_OUTPUT"
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p $DEPLOY_PATH/releases/$RELEASE"

      - name: Upload build to VPS
        run: |
          rsync -az --delete -e "ssh -p ${{ secrets.VPS_PORT }}" \
            deploy/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$DEPLOY_PATH/releases/${{ steps.release.outputs.name }}/

      - name: Activate release & restart app
        env:
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e &&
            mkdir -p $DEPLOY_PATH/logs &&
            ln -sfn $DEPLOY_PATH/shared/.env $DEPLOY_PATH/releases/$RELEASE/.env &&
            ln -sfn $DEPLOY_PATH/releases/$RELEASE $DEPLOY_PATH/current &&
            cd $DEPLOY_PATH/current &&
            pm2 startOrReload ecosystem.config.js --env production &&
            pm2 save &&
            cd $DEPLOY_PATH/releases && ls -1dt release-*/ | tail -n +6 | xargs -r rm -rf
          "
